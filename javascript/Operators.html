<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Operator</h2>
    <p id="demo"></p>
    <p id="shanvi 1"></p>
    <p id="shanvi 2"></p>
    <script>
        //*use +, -, *, / operators*/
        var x = 5;
        var y = 2;
        var z = x + y;
        document.getElementById("demo").innerHTML = z;
        document.getElementById("shanvi 1").innerHTML = x*y;
        document.getElementById("shanvi 2").innerHTML = x/y
    </script>
</body>
</html>
