<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="myH"></h1>
    <p id="myP"></p>

    <script>
        // My heading:
        document.getElementById("myH").innerHTML = "JavaScript Comments";
        document.getElementById("myH").style.backgroundColor = "pink";

        // My paragraph:
        document.getElementById("myP").innerHTML = "My first paragraph.";
        document.getElementById("myP").style.backgroundColor = "purple";
        document.getElementById("myP").style.borderStyle = "solid";
        document.getElementById("myP").style.borderColor = "blue";
    </script>
</body>
</html>
