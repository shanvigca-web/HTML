<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Animal Fact File</title>
    <style>
        /*it changed the backround color to darkgreen*/
        body {
            background-color: darkgreen;
            font-family: Arial, sans-serif;
        }
        /*this code makes a border around the green color and inside the border there is a lightyellow inside the border*/
         .fact-file {
            background-color: lightyellow;
            color: darkslategray;
            width: 260px;
            padding: 20px;
            border: 4px solid forestgreen;
            margin: 30px;
        }  
        /*it makes the Snow Leopard in the image bold*/
         .animal-name {
            color: forestgreen;
            font-size: 22px;
        } 
        /*this one changes 1st 2nd and 3rd lines*/
         .detail {
            color: forestgreen;
        } 
        /*this one changes the last line*/
         .cool-fact {
            color: darkorange;
            font-style: italic;
        } 
    </style>
</head>
<body>
    
    <div class="fact-file">
        <h2 class="animal-name">Snow Leopard</h2>
        <p class="detail">Type: Big Cat</p>
        <p class="detail">Lives in: Mountain ranges of Centerl Asia</p>
        <p class="detail">Diet: Deer, goat, and wild sheep</p>
        <p class="cool-fact">Cool Fact: Can leap up to 15 meters in one jump!</p>
    </div>

</body>
</html>
